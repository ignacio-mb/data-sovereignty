# The transform contract.
#
# Read by TWO things, which is the point:
#   mbx transforms                   builds each table, in this order
#   quality/suites/marts.py          generates the expectations that test them
#
# Declaring a grain here and testing it somewhere else is how the two quietly
# stop agreeing. One declaration, both consumers.
#
# ── Entry shape ──────────────────────────────────────────────────────────────
#
#   - name: fact_issue                # also the target table name in `schema`
#     sql: 30_fact_issue.sql          # relative to transforms/sql/
#     description: >                  # shown in Metabase; write the caveats here
#       One row per issue with SLA flags precomputed.
#     grain: [issue_id]               # asserted after every build; becomes the
#                                     # uniqueness + not-null mart expectations
#     not_null: [account_id]          # additional required columns
#     reconciliation:                 # SQL that must return ZERO rows
#       - description: splits sum to the total
#         query: >
#           SELECT 1 FROM {batch}
#           WHERE issues_opened <> new_issues + reopened_issues
#
# `{batch}` is substituted with the table under test.
#
# ── Order matters ────────────────────────────────────────────────────────────
#
# Transforms are built top to bottom, so each must appear after everything it
# reads. The layering that keeps that honest:
#
#   10_base_*     one per raw table: typed, renamed, hot JSON fields extracted
#   20_dim_*      conformed dimensions (dim_date, dim_account, dim_agent, ...)
#   30_fact_*     grain-locked ledgers (fact_issue: one row per issue)
#   40_metrics_*  wide, join-free marts a person can filter without SQL
#
# Read from the layer below, never from raw_pylon except in base_.
#
# ── Hard rule ────────────────────────────────────────────────────────────────
#
# Plain table transforms only. Never `table-incremental`: Metabase v63's
# git-sync serializer drops template tags from incremental transforms on import
# and reports success anyway, leaving them silently broken. Full refresh is
# entirely adequate at Pylon ticket volumes.

schema: analytics

# ── What is modeled ──────────────────────────────────────────────────────────
#
# Shaped by what Pylon returns for THIS tenant, read off the warehouse rather
# than off the API docs: `priority` and `question_type` are the only custom
# fields populated, `time_in_status_seconds` carries four keys, and 9 issues
# have no status map at all. Re-profile before assuming any of it still holds.
#
# The modeling itself is not this repo's job — it hosts the warehouse and the
# instance, and builds whatever this file declares. How to decide what belongs
# in it lives with the mb-cli project, whose skills are versioned with the
# binary: `mb skills get data-workflow` and `mb skills get transform`.

transforms:
  - name: base_issue
    sql: 10_base_issue.sql
    description: >
      One row per Pylon issue with every JSON blob decoded into typed columns:
      priority and question_type out of custom_fields, tags as an array plus a
      delimited label, and time_in_status_seconds pivoted to one column per
      status (wall-clock and business hours). Account, assignee and requester
      carry their human labels alongside the ids.

      Multi-value fields are both an Array(String) and a ", "-joined label —
      Metabase cannot filter an array, so group on the label and use
      ARRAY JOIN in SQL for per-tag breakouts. question_type additionally gets
      one boolean per configured option; a new option in Pylon shows up in
      question_type_label but needs a column added here.

      A status key absent from the map means the issue never entered that
      status (0); an absent map means Pylon reported no history at all (NULL),
      which is currently 9 issues. number_of_touches is carried through but
      Pylon reports 0 for every issue on this tenant, as do source ('manual')
      and type ('ticket') for cardinality.
    grain: [issue_id]
    not_null: [issue_number, created_at, state, state_bucket, account_id, requester_id]
    reconciliation:
      - description: the four pivoted status columns account for every key in the source map
        query: >
          SELECT issue_id FROM {batch}
          WHERE tracked_status_seconds IS NOT NULL
            AND tracked_status_seconds != ifNull(seconds_in_open, 0)
                                        + ifNull(seconds_in_in_progress, 0)
                                        + ifNull(seconds_in_on_hold, 0)
                                        + ifNull(seconds_in_waiting_on_action, 0)
      - description: the business-hours pivot accounts for every key in its source map
        query: >
          SELECT issue_id FROM {batch}
          WHERE tracked_business_status_seconds IS NOT NULL
            AND tracked_business_status_seconds != ifNull(business_seconds_in_open, 0)
                                                 + ifNull(business_seconds_in_in_progress, 0)
                                                 + ifNull(business_seconds_in_on_hold, 0)
                                                 + ifNull(business_seconds_in_waiting_on_action, 0)
      - description: every account, assignee and requester id resolves to a row in its lookup table
        query: >
          SELECT issue_id FROM {batch}
          WHERE (account_id IS NOT NULL AND account_name IS NULL)
             OR (assignee_id IS NOT NULL AND assignee_name IS NULL)
             OR (requester_id IS NOT NULL AND requester_name IS NULL)
      - description: every state maps to a known bucket
        query: >
          SELECT issue_id FROM {batch} WHERE state_bucket = 'unknown'
