[project]
name = "mb-tools"
version = "0.1.0"
description = "Metabase transforms, semantic layer and content sync, driven through the mb CLI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mbx = "mb_tools.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_tools"]
