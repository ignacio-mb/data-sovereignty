name: data-sovereignty

# ─── Shared fragments ────────────────────────────────────────────────────────

x-pg-base: &pg-base
  image: postgres:16-alpine
  restart: unless-stopped
  healthcheck:
    interval: 2s
    timeout: 5s
    retries: 30

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
  # Local single-user stack: the UI is not exposed beyond the host.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: 'true'
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
    postgresql+psycopg2://${AIRFLOW_USER}:${AIRFLOW_PASSWORD}@airflow-db:5432/${AIRFLOW_DB}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
  AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__PARALLELISM: '4'
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'

  # ── Pipeline configuration ──
  # dlt state lives on a named volume so the incremental cursor survives
  # container recreation. It is a matched pair with warehouse-data.
  DLT_DATA_DIR: /opt/dlt-state
  # dlt re-exports the inferred schema on every ingest, and resolves the directory
  # from the package — PROJECT_ROOT/schemas, which is bind-mounted — so an ingest
  # would rewrite a tracked file. On a host whose deploy is `git reset --hard`,
  # that is a conflict every hour. dlt reads the reviewed import schema from the
  # same directory, so airflow-init seeds it here.
  DS_SCHEMA_DIR: /opt/dlt-state/schemas
  # Where the connected sources' specs live. Set explicitly because the ingest
  # package is INSTALLED into /opt/data-venv, so the repo root it would otherwise
  # derive from its own __file__ resolves inside site-packages. The DAG processor
  # (which reads the specs to generate DAGs) and the CLIs (which read them to run)
  # have to agree on one directory, and this is it.
  DS_SOURCES_DIR: /opt/project/sources

  # Container-side view of the warehouse. These deliberately override whatever
  # is in .env (which holds the host-facing localhost values), so neither side
  # ever has to think about which network it is on.
  DESTINATION__CLICKHOUSE__CREDENTIALS__HOST: warehouse-db
  DESTINATION__CLICKHOUSE__CREDENTIALS__PORT: '9000'
  DESTINATION__CLICKHOUSE__CREDENTIALS__HTTP_PORT: '8123'
  DESTINATION__CLICKHOUSE__CREDENTIALS__USERNAME: ${WAREHOUSE_USER}
  DESTINATION__CLICKHOUSE__CREDENTIALS__PASSWORD: ${WAREHOUSE_PASSWORD}
  # Only the database a connection SELECTS, never one that is queried: every
  # table name in this stack is qualified. Each source lands in its own
  # raw_<source>, which build_pipeline sets per run — a source name here would
  # put every source in one database, sharing one soft-delete pass. Pinned to
  # `default` rather than left unset so a stale .env on a long-lived host cannot
  # reintroduce one.
  DESTINATION__CLICKHOUSE__CREDENTIALS__DATABASE: default
  DESTINATION__CLICKHOUSE__CREDENTIALS__SECURE: '0'

  # ── Metabase ──
  # On the compose network, not the published port: the smoke DAG probes this
  # to prove the instance this stack hosts is up.
  MB_URL: http://metabase:3000

  # ── Data quality ──
  # Passed through EMPTY when unset, not defaulted to a number: each source
  # declares its own freshness SLO in its spec, and a value here overrides every
  # one of them. Defaulting it would silently flatten every contract to 24h.
  GX_FRESHNESS_HOURS: ${GX_FRESHNESS_HOURS:-}
  GX_DOCS_DIR: /opt/project/quality/gx_output/data_docs

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
    args:
      # Digest-pinned to match the Dockerfile's own default — a bare tag here would
      # override the pin. Bumping the tag means re-resolving both.
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_BASE_IMAGE:-apache/airflow:3.3.0-python3.12@sha256:96e99f25815f533b298a4d53f283adf5c84c27334ea16ef232777cb800bddf10}
  image: data-sovereignty/airflow:local
  # Every variable in .env, so that a source's API token reaches the container
  # without compose having to name it. A spec declares `token_env: FOO_TOKEN`;
  # putting FOO_TOKEN in .env is then the whole of connecting its credential, and
  # adding a source stays a spec plus a secret rather than a compose edit.
  #
  # `environment:` below wins over this, which is what keeps the container-side
  # warehouse values from being shadowed by .env's host-facing ones.
  #
  # Plain string form, not `{path:, required: false}`: that spelling needs Compose
  # 2.24 and this stack supports 2.17. So .env must exist — which it already had
  # to, since every credential below interpolates from it; the difference is that
  # a missing one now says so instead of quietly resolving to empty strings.
  # `make` guards on it.
  env_file:
    - .env
  environment: *airflow-env
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    # The workspace is bind-mounted so edits to specs, suites and DAGs take
    # effect without a rebuild. Dependency changes still need `make build`.
    - ./pipeline:/opt/project/pipeline
    - ./quality:/opt/project/quality
    # Read-only: specs are authored in the repo on the host, and nothing in the
    # stack has any business writing one.
    - ./sources:/opt/project/sources:ro
    - dlt-state:/opt/dlt-state
  depends_on:
    warehouse-db:
      condition: service_healthy
    airflow-db:
      condition: service_healthy

x-airflow-service: &airflow-service
  <<: *airflow-common
  restart: unless-stopped
  # Bounded on purpose. Left unlimited, the scheduler and triggerer grew to
  # ~3 GB each on a 7.7 GB Docker VM and OOM-killed Metabase. A laptop stack has
  # to fit in the laptop, and a task that genuinely needs more should fail
  # loudly here rather than quietly evict another service.
  mem_limit: ${AIRFLOW_MEM_LIMIT:-1500m}
  depends_on:
    warehouse-db:
      condition: service_healthy
    airflow-db:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

# ─── Services ────────────────────────────────────────────────────────────────

services:

  # The warehouse. raw_<source> (dlt), analytics (the modeling project), ops (dq).
  warehouse-db:
    image: ${CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:24.8-alpine}
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${WAREHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${WAREHOUSE_DB}
      # Lets the init SQL below issue CREATE DATABASE and GRANT.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    healthcheck:
      # /ping answers before the server will accept queries on 9000, but it is
      # the only check that needs no credentials.
      #
      # 127.0.0.1, never localhost. On a host without IPv6 the name resolves to
      # ::1 first and the check fails with "connection refused" while the server
      # is listening perfectly well on 0.0.0.0 — a healthy warehouse reported as
      # unhealthy, which then blocks Metabase, which depends on it.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    ulimits:
      # ClickHouse refuses to start with the default container limit.
      nofile:
        soft: 262144
        hard: 262144
    # Left unbounded, ClickHouse sizes its caches against the whole host and
    # will happily starve Metabase and Airflow on a laptop.
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-3g}
    ports:
      - "${WAREHOUSE_HTTP_PORT:-8124}:8123"    # HTTP — dlt, GX, Metabase
      - "${WAREHOUSE_NATIVE_PORT:-9001}:9000"  # native — clickhouse-client
    volumes:
      - warehouse-data:/var/lib/clickhouse
      # Runs once, on first init of an empty volume.
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro
      # Read on every start, unlike the init SQL. Keeps ClickHouse inside the
      # container's memory limit instead of being OOM-killed by it.
      - ./warehouse/config/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      # Bind IPv4. Without it, a host with no IPv6 leaves the server listening
      # on nothing and failing its healthcheck forever. Mounted file by file,
      # not as a directory: config.d already holds the image's own
      # docker_related_config.xml, and a directory mount would hide it.
      - ./warehouse/config/zz-listen.xml:/etc/clickhouse-server/config.d/zz-listen.xml:ro

  # Metabase's own application database. Never share this between instances.
  metabase-app-db:
    <<: *pg-base
    environment:
      POSTGRES_USER: ${METABASE_APP_USER}
      POSTGRES_PASSWORD: ${METABASE_APP_PASSWORD}
      POSTGRES_DB: ${METABASE_APP_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - metabase-app-data:/var/lib/postgresql/data

  airflow-db:
    <<: *pg-base
    environment:
      POSTGRES_USER: ${AIRFLOW_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - airflow-db-data:/var/lib/postgresql/data

  metabase:
    image: ${METABASE_IMAGE:-metabase/metabase-enterprise:v1.63.1.6}
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-app-db
      MB_DB_PORT: '5432'
      MB_DB_USER: ${METABASE_APP_USER}
      MB_DB_PASS: ${METABASE_APP_PASSWORD}
      MB_DB_DBNAME: ${METABASE_APP_DB}
      MB_SITE_NAME: ${MB_SITE_NAME:-Data Sovereignty}
      JAVA_TIMEZONE: UTC
      MB_LOAD_SAMPLE_CONTENT: 'false'
      MB_CHECK_FOR_UPDATES: 'false'
      MB_ANON_TRACKING_ENABLED: 'false'
      # Production license token: normal run mode, no metastore override.
      MB_PREMIUM_EMBEDDING_TOKEN: ${MB_PREMIUM_EMBEDDING_TOKEN}
      # The container-aware JVM sizes its heap from the cgroup limit, and with no
      # limit at all takes ~25% of host RAM — enough to starve ClickHouse and
      # Airflow on a shared host. Overridable because the right heap depends on
      # the host: raise both together, never the heap alone.
      JAVA_OPTS: ${METABASE_JAVA_OPTS:--Xmx1500m}
    mem_limit: ${METABASE_MEM_LIMIT:-2g}
    ports:
      - "${METABASE_HOST_PORT:-3100}:3000"
    healthcheck:
      # The image ships one HTTP client or the other depending on the build.
      # 127.0.0.1 rather than localhost, for the reason spelled out on the
      # warehouse healthcheck: no IPv6 on the host means the name resolves to
      # ::1 and the check fails against a perfectly healthy service.
      test: ["CMD-SHELL",
             "curl -fsS http://127.0.0.1:3000/api/health || wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      metabase-app-db:
        condition: service_healthy
      warehouse-db:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/dlt-state/schemas /opt/dlt-state/run-summaries
        # An import schema is a reviewed override that lives in git, so re-seed it
        # on every init: dlt keeps whatever it first wrote into an import directory.
        # Per source — schema_dir() is schemas/<source>/{import,export}, so a flat
        # copy would land somewhere dlt never looks.
        for dir in /opt/project/pipeline/schemas/*/import; do
          [ -d "$dir" ] || continue
          source=$(basename "$(dirname "$dir")")
          mkdir -p "/opt/dlt-state/schemas/$source/import"
          cp "$dir"/*.yaml "/opt/dlt-state/schemas/$source/import/" 2>/dev/null || true
        done
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/dlt-state
        exec runuser -u airflow -- bash -c '
          set -euo pipefail
          airflow db migrate
          # One pool per connected source, each with a single slot: concurrent
          # runs of the same source would race its incremental cursor, and a
          # shared pool would serialize sources that have no reason to wait for
          # each other. Derived from the specs rather than listed here — a
          # generated DAG referencing a pool nobody created queues forever, and
          # a queued task looks like a slow one, not a broken one.
          #
          # Names must match source_dags._orchestration: the spec pool, else
          # <name>_pipeline.
          # $$ throughout: a single $ is interpolated by compose itself, which
          # would substitute these shell variables with empty strings before the
          # container ever saw them — silently creating no pools at all.
          for spec in /opt/project/sources/*.yml; do
            [ -e "$$spec" ] || continue
            pool=$$(python -c "
        import sys, yaml
        doc = yaml.safe_load(open(sys.argv[1])) or {}
        name = doc.get(\"name\")
        if name:
            print((doc.get(\"orchestration\") or {}).get(\"pool\") or f\"{name}_pipeline\")
        " "$$spec") || continue
            [ -n "$$pool" ] || continue
            airflow pools set "$$pool" 1 \
              "Serializes dlt runs for one source: concurrent ingests would race its cursor."
          done
        '
    restart: "no"
    depends_on:
      warehouse-db:
        condition: service_healthy
      airflow-db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-service
    command: api-server
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      # 127.0.0.1, not localhost — see the warehouse healthcheck.
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/api/v2/monitor/health"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  airflow-scheduler:
    <<: *airflow-service
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-dag-processor:
    <<: *airflow-service
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-triggerer:
    <<: *airflow-service
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # The execution seam for one-off commands: ingest, dq and airflow are all on
  # PATH here. `make` uses this for everything it runs.
  airflow-cli:
    <<: *airflow-common
    profiles: ["cli"]
    restart: "no"
    # The base image's entrypoint forwards everything to `airflow`, which turns
    # `run --rm airflow-cli dq ops-init` into `airflow dq ops-init`. Clearing it
    # lets the container run any binary on PATH; `airflow ...` still works.
    entrypoint: []
    # …but clearing the entrypoint also discards the uid handling it does, and
    # that is load-bearing. Airflow is installed into the USER site,
    # /home/airflow/.local/lib/python3.12/site-packages, and Python derives that
    # path from HOME. Docker sets HOME from the passwd entry of whatever uid it
    # is given: 50000 is `airflow` (HOME=/home/airflow), but 1000 is `default`
    # (HOME=/), and the instance runs as 1000 because render_env_from_ssm.sh
    # sets AIRFLOW_UID to the operator's own id. With HOME=/ the interpreter
    # looks in /.local, finds nothing, and every command dies on
    # `ModuleNotFoundError: No module named 'airflow'` — while the long-running
    # services, which keep the entrypoint, are perfectly fine.
    #
    # Pinned rather than left to the uid, so this works on a laptop where
    # AIRFLOW_UID is 50000 and on a host where it is anything else. It only
    # looked correct locally because the default happens to be the one uid that
    # has the right home.
    environment:
      <<: *airflow-env
      HOME: /home/airflow
    command: ["airflow", "version"]

  # Serves the Great Expectations data docs written by `dq docs-build`.
  datadocs:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${DATADOCS_HOST_PORT:-8081}:80"
    volumes:
      - ./quality/gx_output/data_docs:/usr/share/nginx/html:ro

volumes:
  warehouse-data:
  metabase-app-data:
  airflow-db-data:
  # The dlt incremental cursor and pending load packages. Matched pair with
  # warehouse-data: destroying one without the other desynchronizes the pipeline.
  dlt-state:
