[project]
name = "ingest-runtime"
version = "0.1.0"
description = "Spec-driven REST ingestion into ClickHouse (dlt)"
requires-python = ">=3.11"
dependencies = [
    "dlt[clickhouse]>=1.28.1,<2",
    # A runtime dependency, not a test one: `ingest run --destination duckdb` is
    # the rehearsal every new connector goes through before it is pointed at the
    # warehouse, and the add-source runbook tells you to run it in the CLI
    # container. With duckdb only in the dev group that command failed there,
    # which pushes the one safe rehearsal onto the host or skips it entirely.
    "dlt[duckdb]>=1.28.1,<2",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    # Spec shape lives in sources/source.schema.json, and is enforced on load
    # rather than only in CI: a spec that reaches the runtime unvalidated is one
    # whose typo becomes a silently missing column.
    "jsonschema>=4.21",
    "pendulum>=3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6",          # source specs
]

[project.scripts]
ingest = "ingest_runtime.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "clickhouse: needs a live warehouse; deselected by default, run via `make test-warehouse`",
]
addopts = "-m 'not clickhouse'"

[tool.ruff]
line-length = 110
