[project]
name = "ingest-runtime"
version = "0.1.0"
description = "Spec-driven REST ingestion into ClickHouse (dlt)"
requires-python = ">=3.11"
dependencies = [
    "dlt[clickhouse]>=1.28.1,<2",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "pendulum>=3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6",          # source specs
]

[project.scripts]
ingest = "ingest_runtime.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
    "dlt[duckdb]>=1.28.1,<2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "clickhouse: needs a live warehouse; deselected by default, run via `make test-warehouse`",
]
addopts = "-m 'not clickhouse'"

[tool.ruff]
line-length = 110
