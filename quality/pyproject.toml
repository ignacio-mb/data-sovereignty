[project]
name = "quality-runtime"
version = "0.1.0"
description = "Great Expectations suites generated from each source's contract"
requires-python = ">=3.11,<3.14"
dependencies = [
    # For the source spec, and only for that. A source declares its expectations
    # in the same file that declares what to fetch, so parsing it belongs in one
    # place; a second parser here would be a second thing to keep in step with
    # the contract. The dependency runs one way — nothing in the pipeline
    # imports the quality package.
    "ingest-runtime",
    # Exact pin: Great Expectations moves its Core API between minors, so an
    # upgrade is a deliberate event with a test run attached, never a drift.
    # NOT great-expectations[clickhouse]: that extra is unsatisfiable on
    # Python 3.12 — it pins sqlalchemy<2 while requiring
    # clickhouse-sqlalchemy>=0.3, which requires sqlalchemy>=2. The dialect
    # is a direct dependency instead.
    "great-expectations==1.19.1",
    "clickhouse-sqlalchemy>=0.3.2,<0.4",   # SQLAlchemy dialect, for GX
    "clickhouse-connect>=0.8",             # native client, for the ops writes
    "click>=8.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
dq = "quality_runtime.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_runtime"]
