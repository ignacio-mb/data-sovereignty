[project]
name = "pylon-quality"
version = "0.1.0"
description = "Great Expectations suites for the Pylon warehouse"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Exact pin: Great Expectations moves its Core API between minors, so an
    # upgrade is a deliberate event with a test run attached, never a drift.
    "great-expectations[postgresql]==1.19.1",
    "click>=8.1",
    "psycopg[binary]>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
dq = "pylon_quality.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pylon_quality"]
