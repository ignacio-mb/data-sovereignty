[project]
name = "data-sovereignty"
version = "0.1.0"
description = "Self-hosted multi-source ingestion into ClickHouse, served by Metabase"
# Upper bound comes from great-expectations. 3.12 matches the Airflow image.
requires-python = ">=3.11,<3.14"
# The root is a virtual project: it exists to pull the two workspace members
# into one environment, so `ingest` and `dq` are on PATH together.
dependencies = [
    "ingest-runtime",
    "quality-runtime",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["pipeline", "quality"]

[tool.uv.sources]
ingest-runtime = { workspace = true }
quality-runtime = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
    "dlt[duckdb]>=1.28.1,<2",
    "ruff>=0.6",
]
# Airflow is a heavy, tightly-pinned tree. It is only needed to import-check the
# DAGs, so it stays out of the default sync: `uv sync --group dag-tests`.
dag-tests = [
    "apache-airflow==3.3.0",
]

[tool.pytest.ini_options]
# `sources` is in here because a connector is a directory: the tests for the
# behaviour its spec could NOT declare live beside the extension they pin, and
# a test nothing collects is a test that rots. The generic invariants stay in
# pipeline/tests/test_connector_contract.py.
testpaths = ["pipeline/tests", "quality/tests", "airflow/tests", "sources"]
# No markers and nothing deselected: every test runs offline, against mocked HTTP
# and duckdb, so there is no subset to hold back. airflow/tests skips itself when
# Airflow is absent — its own importorskip, not a marker.

[tool.ruff]
line-length = 110
exclude = ["airflow/logs", "quality/gx_output"]
