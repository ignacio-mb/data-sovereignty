# YouTube — a channel's analytics, in the shape Fivetran's YouTube Analytics
# connector lands them.
#
# Three Google services, and which one a resource uses is the whole story:
#
#   YouTube Reporting API      the 20 report tables. Bulk daily CSVs, one file
#   youtubereporting.g.c/v1    per report type per day, generated by a
#                              "reporting job" you create once. This is where
#                              per-video-per-day facts come from, and the ONLY
#                              place they exist — see the note on the report
#                              section below.
#   YouTube Data API v3        the 5 metadata tables (channel, video, playlist,
#   www.googleapis.com         comment, caption). Live JSON, quota-metered in
#                              units against a daily pool.
#   YouTube Analytics API v2   not used here. It is the interactive query
#                              surface, and it cannot express the grain these
#                              tables need — see below.
#
# Fivetran uses the same first two, verbatim: "We sync YouTube Analytics data by
# using the following APIs: YouTube Reporting API ... YouTube Data API".
#
# ── Why not the Analytics API, which looks like the obvious choice ───────────
#
# It cannot produce per-video-per-day rows at all. `day` and `video` are not a
# legal dimension combination: the top-videos report takes `video` alone, caps
# at 200 rows, and requires a `sort`. Getting daily video granularity out of it
# means one request per video per day, forever. The bulk reports carry
# (date, video_id, ...) natively with no row cap. That single fact decides the
# engine, and it is why Fivetran made the same choice.
#
# ── Why the schema differs from Fivetran's in three places ──────────────────
#
# The column names here are Fivetran's. Three things are deliberately NOT:
#
#   table names   Fivetran freezes them at an old report version — it says so
#                 outright: "we sync the channel_basic_a3 report to the
#                 CHANNEL_BASIC_A2 table". Worse, its docs, its ERD and its own
#                 dbt package spell the same table three different ways
#                 (CHANNEL_BASIC_A2 / channel_basic_a_2_report /
#                 channel_basic_a_2), so there is no single literal name to
#                 copy. Tables here are named for the report actually fetched.
#   primary keys  Fivetran keys report tables on `_fivetran_id`, "generated
#                 based on the row's set of values" — so when YouTube restates
#                 a day (it does, routinely, see `create_time` below) the
#                 revised row gets a DIFFERENT key and lands beside the stale
#                 one instead of replacing it. Every report here is keyed on
#                 its real dimension tuple, verified against Google's docs, so
#                 a restatement merges.
#   timestamps    Fivetran: "We don't convert source timestamps to Universal
#                 Time Coordinated (UTC) but use Pacific Standard Time (PST)".
#                 Everything here that is an instant is UTC. `date` is neither
#                 — see the note on it below.
#
# ── The 30-day cliff, which is the most important line in this file ─────────
#
# A reporting job's history reaches back exactly 30 days before the job was
# created, and no API can widen it: "YouTube generates historical reports
# covering the 30-day period prior to when you created the job." There is no
# start/end parameter on any Reporting API method. Reports are then retained 60
# days from generation (30 for the historical backfill batch).
#
# So `youtube_backfill` cannot reach history, and neither can anything else.
# Whatever is not collected inside that window is gone permanently. The jobs
# are created by the first run of `youtube_ingest`; `backfill_start` below is
# 30 days before that day and is a hard floor, not a conservative guess.
#
# ── What "hourly" buys, since the data is daily ─────────────────────────────
#
# YouTube's finest grain is a day, in PACIFIC time, published with a ~48 hour
# lag. Hourly cannot make the numbers finer. What arrives on no fixed schedule
# is the REPORT: `jobs.reports.list?createdAfter=` is a cursor over report
# CREATION time, and YouTube re-issues a restated day as a brand new report id
# carrying the same start/end time. Hourly polling is what picks up both a
# newly-published day and a restatement of an old one promptly, which is
# exactly what that cursor exists for. Google's own instruction: "if two new
# reports have the same startTime and endTime property values, only import the
# report with the newer createTime value."

name: youtube
display_name: YouTube
docs_url: https://developers.google.com/youtube/reporting/v1/reports

api:
  # The Reporting API host. The Data API lives on a different host, so the five
  # metadata resources each carry `endpoint.base_url` — read only by the
  # extension, which builds every URL itself.
  base_url: https://youtubereporting.googleapis.com
  auth:
    # NOT a type `runtime._auth()` can build, and that is deliberate rather
    # than a mistake to be fixed there.
    #
    # Every Reporting API method requires OAuth 2.0 user-delegated consent.
    # Google closes the two doors that would make this a static token:
    # a service account cannot be used ("there is no way to link a Service
    # Account to a YouTube account" -> NoLinkedYouTubeAccount), and the device
    # flow is unsupported. What is left is an authorization_code grant done
    # once by a human who owns the channel, and a stored refresh token
    # exchanged for a one-hour access token on every run.
    #
    # That credential is THREE values (client id, client secret, refresh
    # token). `api.auth` carries exactly one `token_env`, so the spec shape
    # cannot express it and `_auth()` correctly refuses the type name below.
    # Nothing here ever reaches `_auth()`: every resource in this file uses a
    # delegated strategy, so `build_source` hands all of them to the extension,
    # which mints the token itself. `test_youtube_source.py` pins that
    # invariant — a resource switched to `full_refresh` would route to the
    # declarative path and fail on the auth type, so the test fails first.
    #
    # Promoting this to a real runtime auth kind is the right move the day a
    # SECOND source needs a refresh-token grant, not today: one connector is
    # not enough to know what the vocabulary should be.
    type: oauth2_refresh_token
    token_env: YOUTUBE_OAUTH_REFRESH_TOKEN
    # Read by the extension, not by the runtime. Named here rather than
    # hardcoded so the credential is discoverable from the spec alone, and so
    # `scripts/secrets_push.sh`-style greps have something to find.
    client_id_env: YOUTUBE_OAUTH_CLIENT_ID
    client_secret_env: YOUTUBE_OAUTH_CLIENT_SECRET
    token_url: https://oauth2.googleapis.com/token
    # The minimum grant that reads bulk reports plus public metadata.
    # yt-analytics-monetary.readonly is deliberately absent: no revenue report
    # is fetched here, and asking for it triggers a stricter Google
    # verification review. youtube.force-ssl is present only because
    # captions.list has no anonymous path and captions.download needs it — if
    # the `caption` resource is deleted, drop this scope and re-consent.
    scopes:
      - https://www.googleapis.com/auth/yt-analytics.readonly
      - https://www.googleapis.com/auth/youtube.readonly
      - https://www.googleapis.com/auth/youtube.force-ssl
  # The channel to read. `MINE` resolves to whichever channel consented, which
  # is what a single-channel connector wants; a literal UC… id would let the
  # credential read a channel it merely has access to. Reporting jobs are
  # scoped by the credential regardless, so this only affects the Data API.
  channel: MINE

# NO rate_limits, and this is a researched absence rather than an oversight.
#
# Neither service publishes a requests-per-minute figure anywhere. Google's own
# position on the Reporting API is that "Quota usage is not an issue because
# data is retrieved once and then filtered, sorted, and queried within the
# application", and the Data API publishes a DAILY UNIT quota (10,000 units,
# see `unit_budget` below) rather than a rate. The real per-second ceiling is
# visible only in the Quotas panel of the Google Cloud project actually being
# used, so inventing one here would be exactly the guess CLAUDE.md forbids.
#
# The consequence is explicit, not hidden: `EndpointPacer` counts requests for
# a family with no declared budget and never sleeps on it. Requests still show
# up in `requests_by_family` in ops.pipeline_runs. If the Cloud console shows a
# real limit for this project, add it here as `reporting:` / `data_api:` — the
# families are already declared on every endpoint below.

orchestration:
  schedule: "29 * * * *"          # :29 — clear of :07, :17, :23 and :41
  # 30 days before the day the reporting jobs are created, which is the hard
  # floor on history (see the header). Also what the reconcile DAG passes as
  # --start, which is what makes the tombstone pass eligible for the three
  # fully-re-fetched metadata tables.
  backfill_start: "2026-07-08"
  reconcile: "0 4 * * 6"          # Saturday 04:00 UTC — the only run that tombstones
  pool: youtube_pipeline          # size 1: concurrent runs would race the cursors
  timeouts_minutes:
    # Must stay under the hour or runs queue on the pool. A steady-state run is
    # 20 report listings, at most a handful of CSV downloads, and a bounded
    # metadata pass — seconds to low minutes. The 30-day first run downloads
    # ~600 CSVs (20 reports x 30 days) and is the case this number is sized for.
    ingest: 55
    # `youtube_backfill` exists because the generator builds it for every spec,
    # but --start/--end reach nothing here: build_source takes no window and
    # every resource is delegated, so it fetches what an ordinary run fetches.
    # The CLI warns about exactly this. History is bounded by the reporting
    # job, not by a flag — see the header.
    backfill: 55
    reconcile: 55

resources:
  # ══ Report tables ═════════════════════════════════════════════════════════
  #
  # All 20 are the same algorithm, so the extension serves them with one
  # `build_resource`. Per resource the only things that differ are the report
  # type id and the key columns.
  #
  # The algorithm, per resource per run:
  #   1. find this report type's reporting job, creating it if absent — the
  #      job-create-then-reuse pattern Fivetran documents. Creating a second
  #      job for a type that already has one does not widen history; it just
  #      duplicates reports.
  #   2. GET /v1/jobs/{jobId}/reports?createdAfter=<watermark>, paged.
  #   3. drop any report whose (startTime, endTime) is also covered by a report
  #      with a newer createTime — Google's documented dedup rule.
  #   4. download each survivor's CSV and yield its rows, parsed BY HEADER.
  #   5. advance the watermark to the newest createTime processed, once, after
  #      the whole worklist succeeded.
  #
  # Why `strategy: search_window`: `createdAfter` is a server-side filter over
  # a cursor field, which is what that strategy names. There is no separate
  # backfill endpoint (the Lever case, not the Pylon case) because history here
  # is not addressable at all.
  #
  # Four things about these tables that are easy to get wrong:
  #
  #   `date` is TEXT, not a timestamp, on purpose. It is a calendar day in
  #   Pacific time — "the period beginning at 12:00AM Pacific time and ending
  #   at 11:59PM Pacific time" — so parsing it into a UTC instant would encode
  #   a specific wrong answer 8 hours out, in a primary key column, and make
  #   every join against a UTC timestamp silently off by a day at the edges.
  #   It stays exactly the YYYY-MM-DD string YouTube wrote.
  #
  #   Key columns can be legitimately EMPTY, and the CSV's empty field must
  #   stay an empty string rather than becoming NULL — a NULL inside a merge
  #   key is not a key. Confirmed cases: `video_id` on channel_basic_a3
  #   (channel-level subscriber activity that did not happen on a watch page —
  #   Google: "a basic user activity report contains a row that does not
  #   specify a video_id dimension value"), `traffic_source_detail` outside the
  #   15 types that populate it, `playback_location_detail` when the type is
  #   not EMBEDDED, and both subtitle columns (undocumented, so assumed).
  #
  #   Unknown values are SENTINELS, not blanks: country_code `ZZ`,
  #   province_code `US-ZZ`, device_type `100`, operating_system `1`,
  #   traffic_source_type `0`, playback_location_type `5`, sharing_service `0`.
  #   A not-null check passes on all of them; an enum check must allow them.
  #
  #   Columns are parsed by header name, never by position, and no metric is
  #   declared in this file. Google: "don't assume that views will be the first
  #   metric returned ... your application should expect the addition [of] new
  #   metrics to any report". Two live traps this avoids: `engaged_views` was
  #   inserted BEFORE `views` in the a3 bump, and channel_reach_combined_a1 is
  #   the one report in the catalogue that ends `operating_system, device_type`
  #   instead of `device_type, operating_system`. A positional parser would
  #   transpose OS codes (1-32) with form-factor codes (100-105) and never
  #   error, because both are small integers.
  #
  # No `soft_delete` on any of them. A report row is never deleted upstream; a
  # day is RESTATED, which the composite key merges. Google also documents that
  # a regenerated report legitimately contains FEWER videos than the one it
  # replaces ("Backfill reports don't contain any references to YouTube
  # resources that were deleted at least 30 days prior"), so absence here
  # carries no deletion signal at all.
  #
  # Report type ids are the CURRENT versions. The channel_* reports moved
  # a2 -> a3 and the playlist_* reports a1 -> a2 effective 2025-06-30, and the
  # predecessors were deprecated on 2025-10-31 — a spec written against the a2
  # channel ids today would create jobs that never produce a report.
  # channel_demographics_a1, channel_cards_a1 and the two reach reports are a1
  # because they carry no `views` metric and so were never bumped.

  # ── channel: user activity ────────────────────────────────────────────────
  - name: channel_basic_a3
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status, country_code]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_basic_a3
      endpoint: {path: /v1, family: reporting}
    # Only the report's own provenance timestamps are instants. See `date` above.
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_combined_a3
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, playback_location_type, traffic_source_type,
                  device_type, operating_system]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_combined_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── channel: geography and platform ───────────────────────────────────────
  - name: channel_province_a3
    # US states and DC only — the report is filtered to country_code == US, so
    # province_code is never blank, only ever the US-ZZ sentinel.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, province_code]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_province_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_device_os_a3
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, device_type, operating_system]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_device_os_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── channel: discovery ────────────────────────────────────────────────────
  - name: channel_traffic_source_a3
    # traffic_source_detail is empty unless traffic_source_type is one of the
    # 15 that populate it. Empty string, not null — see the section header.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, traffic_source_type, traffic_source_detail]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_traffic_source_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_playback_location_a3
    # playback_location_detail is empty whenever playback_location_type is not
    # EMBEDDED: "In other rows, this dimension's value is empty."
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, playback_location_type, playback_location_detail]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_playback_location_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── channel: audience ─────────────────────────────────────────────────────
  - name: channel_demographics_a1
    # One metric only: views_percentage. It is a percentage, not a count, so it
    # cannot be summed across rows — and YouTube restricts these rows to
    # logged-in viewers. Never bumped past a1: no `views` metric to change.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, age_group, gender]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_demographics_a1
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_sharing_service_a2
    # sharing_service is an integer code (0 = Unknown … 128 = Remix), not a name.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, sharing_service]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_sharing_service_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_subtitles_a3
    # Excludes views with captions off. Neither subtitle column has a
    # documented emptiness condition, unlike the *_detail dimensions — so
    # "possibly empty" here is a defensive assumption, not a documented fact,
    # and both are non-core dimensions that can change without notice.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, subtitle_language, subtitle_language_autotranslated]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_subtitles_a3
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── channel: on-video elements ────────────────────────────────────────────
  # Annotations were retired as an authoring feature, so these tables cover
  # historical dates and then stop growing. Kept because Fivetran ships them
  # and because the historical rows are real.
  - name: channel_annotations_a2
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, annotation_type, annotation_id]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_annotations_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_cards_a1
    # The metric is card_click_rate, not card_click_through_rate — the
    # annotation report uses the *_click_through_rate spelling and this one
    # does not.
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, card_type, card_id]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_cards_a1
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_end_screens_a2
    primary_key: [date, channel_id, video_id, live_or_on_demand, subscribed_status,
                  country_code, end_screen_element_type, end_screen_element_id]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_end_screens_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── channel: reach ────────────────────────────────────────────────────────
  # Added by Google on 2026-01-15, after the a2->a3 migration, which is why
  # they are a1 and carry no `views`: the metrics are
  # video_thumbnail_impressions and video_thumbnail_impressions_ctr. The ctr is
  # a rate with no clicks column beside it, so it cannot be re-derived after
  # rolling rows up.
  - name: channel_reach_basic_a1
    primary_key: [date, channel_id, video_id]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_reach_basic_a1
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: channel_reach_combined_a1
    # NOTE the dimension order: operating_system BEFORE device_type. This is
    # the only report in the catalogue that does that, and it is why the CSV is
    # parsed by header name. The key below is written in the order the docs
    # list it, but nothing depends on that order.
    primary_key: [date, channel_id, video_id, traffic_source_type,
                  traffic_source_detail, operating_system, device_type]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: channel_reach_combined_a1
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ── playlist reports ──────────────────────────────────────────────────────
  # Same shape as the channel reports plus a playlist_id dimension. All six
  # share one identical 7-metric set, and none carries the red_* or
  # average_view_duration_percentage metrics the channel reports have.
  - name: playlist_basic_a2
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_basic_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: playlist_combined_a2
    # 11 dimensions — the widest grain in the set.
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code, playback_location_type,
                  traffic_source_type, device_type, operating_system]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_combined_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: playlist_province_a2
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code, province_code]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_province_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: playlist_device_os_a2
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code, device_type, operating_system]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_device_os_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: playlist_traffic_source_a2
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code, traffic_source_type,
                  traffic_source_detail]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_traffic_source_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  - name: playlist_playback_location_a2
    primary_key: [date, channel_id, playlist_id, video_id, live_or_on_demand,
                  subscribed_status, country_code, playback_location_type,
                  playback_location_detail]
    write_disposition: merge
    incremental:
      strategy: search_window
      report_type: playlist_playback_location_a2
      endpoint: {path: /v1, family: reporting}
    timestamp_columns: [_report_create_time, _report_start_time]
    hint_columns: [_report_create_time]

  # ══ Metadata tables ═══════════════════════════════════════════════════════
  #
  # Data API v3, and the constraint that shapes all five is the quota: 10,000
  # UNITS PER DAY per Cloud project, shared across every endpoint, and "all API
  # requests, including invalid requests, incur at least a one-point quota
  # cost". At an hourly schedule that is ~416 units per run, which is the
  # budget every number below is sized against:
  #
  #   channel   1 unit/run                        24/day
  #   playlist  1 + ceil(playlists/50) ~ 2        48/day
  #   video     2 x ceil(videos/50) ~ 20 at 500   480/day
  #   comment   unit_budget: 120                  2,880/day
  #   caption   unit_budget: 250                  6,000/day
  #                                        total ~9,432/day
  #
  # `strategy: parent_fanout` on all five: the endpoint is scoped to a parent
  # and must be called once per parent, every parent every run, with the
  # child's own bound deciding what comes back. That is literally true for
  # video/comment/caption (fanned out over the channel and its videos) and for
  # playlist (playlists.list?channelId=). For `channel` itself the parent list
  # has exactly one member, so the strategy is degenerate there rather than
  # wrong — worth naming plainly instead of inventing a strategy for one call.
  #
  # No resource here is `full_refresh`, and that is load-bearing, not
  # incidental: `full_refresh` is the one strategy `build_source` handles
  # declaratively, which would route it through `runtime._auth()` and fail on
  # this spec's auth type. See the note on `api.auth`.
  #
  # dlt snake_cases on the way in, so the promoted targets below are written in
  # Fivetran's final spelling and the paths in the API's own camelCase.
  #
  # Each promoted part ALSO lands whole, JSON-stringified, under its own name
  # (`snippet`, `status`, `content_details`, `statistics`, `player`) because
  # `promote` digs into the record rather than consuming it. That is not waste:
  # it is how a field Google adds tomorrow reaches the warehouse without a spec
  # edit, and five of Fivetran's own columns (`branding_settings`,
  # `content_owner_details`, `localizations`, `status`, `topic_details`) are
  # exactly that passthrough already.

  - name: channel
    primary_key: id
    write_disposition: merge
    # Fully re-fetched every run, so absence really does mean gone.
    soft_delete: always
    incremental:
      strategy: parent_fanout
      endpoint:
        path: /youtube/v3/channels
        base_url: https://www.googleapis.com
        family: data_api
        params:
          part: snippet,contentDetails,statistics,status,brandingSettings,topicDetails,localizations
    # No TOP-LEVEL timestamp key exists on these records — every instant is
    # nested inside a part. `flatten_record` only walks the record's own top
    # level, so naming a dotted path here would match nothing; the promoted
    # targets are parsed via hint_columns instead (see make_transformer).
    timestamp_columns: []
    promote:
      snippet.title: snippet_title
      snippet.description: snippet_description
      snippet.customUrl: snippet_custom_url
      snippet.publishedAt: snippet_published_at
      snippet.defaultLanguage: snippet_default_language
      snippet.country: snippet_country
      snippet.localized: snippet_localized
      snippet.thumbnails: snippet_thumbnails
      statistics.viewCount: statistics_view_count
      statistics.subscriberCount: statistics_subscriber_count
      statistics.hiddenSubscriberCount: statistics_hidden_subscriber_count
      statistics.videoCount: statistics_video_count
      contentDetails.relatedPlaylists.uploads: content_details_uploads
      contentDetails.relatedPlaylists.likes: content_details_likes
    # snippet_published_at is a PROMOTED target dug out of a nested path, so
    # `timestamp_columns` could never name it — but it still needs the hint or
    # it lands as text. Everything else promoted here is a scalar or a JSON
    # blob that nothing compares.
    hint_columns: [snippet_published_at]

  - name: playlist
    primary_key: id
    write_disposition: merge
    soft_delete: always
    incremental:
      strategy: parent_fanout
      parent: channel
      endpoint:
        path: /youtube/v3/playlists
        base_url: https://www.googleapis.com
        family: data_api
        page_size: 50
        page_size_param: maxResults
        params:
          part: snippet,contentDetails,status,player,localizations
    # No TOP-LEVEL timestamp key exists on these records — every instant is
    # nested inside a part. `flatten_record` only walks the record's own top
    # level, so naming a dotted path here would match nothing; the promoted
    # targets are parsed via hint_columns instead (see make_transformer).
    timestamp_columns: []
    # `content_details_item_count` is a count, and Fivetran ships no
    # playlist-to-video bridge table at all — playlistItems is not synced
    # there, so playlist membership is simply not in that schema. It is not
    # added here either: this connector matches that schema, and deciding what
    # membership MEANS is modelling.
    promote:
      snippet.channelId: snippet_channel_id
      snippet.channelTitle: snippet_channel_title
      snippet.title: snippet_title
      snippet.description: snippet_description
      snippet.publishedAt: snippet_published_at
      snippet.defaultLanguage: snippet_default_language
      snippet.localized: snippet_localized
      snippet.thumbnails: snippet_thumbnails
      contentDetails.itemCount: content_details_item_count
      status.privacyStatus: privacy_status
      player.embedHtml: player_embed_html
    hint_columns: [snippet_published_at]

  - name: video
    primary_key: id
    write_disposition: merge
    # Honest here, and better than Fivetran, which does not support capture
    # deletes at all: this resource walks the ENTIRE uploads playlist every
    # run, so a video that stops appearing really is gone or has gone private.
    # Only the Saturday reconcile passes --mark-deleted, so that is the one run
    # that flips the flag, and max_deleted_fraction below catches a partial
    # enumeration before it tombstones the catalogue.
    soft_delete: always
    incremental:
      strategy: parent_fanout
      parent: channel
      # The documented enumeration path, and deliberately not search.list:
      # channels.list -> contentDetails.relatedPlaylists.uploads ->
      # playlistItems.list (50/page) -> videos.list?id=<=50 ids to hydrate.
      # search.list is capped at 100 CALLS/day project-wide and returns at most
      # 500 videos for a channelId, so it cannot enumerate a real catalogue.
      endpoint:
        path: /youtube/v3/videos
        base_url: https://www.googleapis.com
        family: data_api
        # videos.list?id= is NOT paginated — Google: maxResults "is not
        # supported for use in conjunction with the id parameter" — so this is
        # the client-side batch size for the id list, not a page size. 50 is
        # the limit every client library assumes; Google documents it for the
        # Content ID API's list methods but not for this one, so it is an
        # empirical constant.
        page_size: 50
        params:
          part: snippet,contentDetails,statistics,status,player,topicDetails,localizations
    # No TOP-LEVEL timestamp key exists on these records — every instant is
    # nested inside a part. `flatten_record` only walks the record's own top
    # level, so naming a dotted path here would match nothing; the promoted
    # targets are parsed via hint_columns instead (see make_transformer).
    timestamp_columns: []
    promote:
      snippet.channelId: snippet_channel_id
      snippet.channelTitle: snippet_channel_title
      snippet.title: snippet_title
      snippet.description: snippet_description
      snippet.publishedAt: snippet_published_at
      snippet.categoryId: snippet_category_id
      snippet.defaultLanguage: snippet_default_language
      snippet.defaultAudioLanguage: snippet_default_audio_language
      snippet.liveBroadcastContent: snippet_live_broadcast_content
      snippet.tags: snippet_tags
      snippet.localized: snippet_localized
      snippet.thumbnails: snippet_thumbnails
      statistics.viewCount: statistics_view_count
      statistics.likeCount: statistics_like_count
      statistics.dislikeCount: statistics_dislike_count
      statistics.favoriteCount: statistics_favorite_count
      statistics.commentCount: statistics_comment_count
      contentDetails.duration: content_details_duration
      contentDetails.dimension: content_details_dimension
      contentDetails.definition: content_details_definition
      contentDetails.caption: content_details_caption
      contentDetails.licensedContent: content_details_licensed_content
      contentDetails.projection: content_details_projection
      contentDetails.hasCustomThumbnail: content_details_has_custom_thumbnail
      contentDetails.regionRestriction: content_details_region_restriction
      status.uploadStatus: upload_status
      status.privacyStatus: privacy_status
      status.failureReason: status_failure_reason
      status.rejectionReason: status_rejection_reason
      status.license: status_license
      status.embeddable: status_embeddable
      status.publicStatsViewable: status_public_stats_viewable
      status.madeForKids: status_made_for_kids
      status.selfDeclaredMadeForKids: status_self_declared_made_for_kids
      status.publishAt: status_publish_at
      player.embedHtml: player_embed_html
      player.embedHeight: player_embed_height
      player.embedWidth: player_embed_width
    # Both promoted timestamps need the hint; nothing else here is compared, so
    # nothing else is hinted.
    #
    # The statistics_*_count columns land as TEXT, matching Fivetran, and that
    # is the API's doing rather than a choice: `statistics.viewCount` is a JSON
    # string ("12345") in the Data API response, which is presumably why
    # Fivetran types them String too. Verified by loading one, not assumed.
    #
    # One real gap against Fivetran, which since April 2026 uses "fixed schema
    # models": dlt materialises a column only once some row carries a value, so
    # a field no video has yet (status_failure_reason on a channel with no
    # failed uploads, snippet_default_audio_language where none is set) is
    # ABSENT here rather than present-and-null. Forcing them into existence
    # means hinting ~40 columns, and a hint is a schema commitment — CLAUDE.md's
    # rule is to hint only what the incremental logic compares. The column
    # appears on the first row that populates it.
    hint_columns: [snippet_published_at, status_publish_at]

  - name: comment
    primary_key: id
    write_disposition: merge
    # NO soft_delete, unlike the three above. This resource is budget-bounded
    # (below), so a run that ran out of units has simply not looked at the rest
    # — absence means "not reached this pass", not "deleted upstream", and
    # tombstoning on it would wipe most of the table.
    incremental:
      strategy: parent_fanout
      parent: channel
      # commentThreads.list?allThreadsRelatedToChannelId gets every thread on
      # the channel AND its videos in one paged call, at 1 unit per 100
      # threads. The per-video alternative costs 1 unit per video per run
      # before it has read anything.
      #
      # Fivetran flattens threads and replies into one table, so this does too:
      # a reply is a row whose snippet_parent_id is set. part=replies returns
      # at most 5 replies per thread, so a thread with more is topped up via
      # comments.list?parentId= at 1 unit each — which is required, not
      # optional: "a commentThread resource does not necessarily contain all
      # replies to a comment, and you need to use the comments.list method if
      # you want to retrieve all replies".
      endpoint:
        path: /youtube/v3/commentThreads
        base_url: https://www.googleapis.com
        family: data_api
        page_size: 100
        page_size_param: maxResults
        params:
          part: snippet,replies
          # Newest activity first, so a budget-bounded pass sees fresh threads
          # before old ones. NOT used for an early exit: what `time` orders by
          # is not documented precisely enough to stop on, and stopping early
          # on a guess loses comments silently. The pass is resumable instead —
          # see `unit_budget`.
          order: time
      # Units this resource may spend per run. When it runs out, the page token
      # it stopped on is persisted and the next run resumes there; a completed
      # pass starts over from page one. So the table converges rather than
      # either blowing the daily quota or permanently missing a tail.
      unit_budget: 120
    # Nested, so not top-level keys — see the note on `channel`.
    timestamp_columns: []
    promote:
      snippet.channelId: snippet_channel_id
      snippet.videoId: video_id
      snippet.parentId: snippet_parent_id
      snippet.textDisplay: snippet_text_display
      snippet.textOriginal: snippet_text_original
      snippet.authorDisplayName: snippet_author_display_name
      snippet.authorProfileImageUrl: snippet_author_profile_image_url
      snippet.authorChannelUrl: snippet_author_channel_url
      snippet.authorChannelId.value: snippet_author_channel_id
      snippet.canRate: snippet_can_rate
      snippet.viewerRating: snippet_viewer_rating
      snippet.likeCount: snippet_like_count
      snippet.moderationStatus: snippet_moderation_status
      snippet.publishedAt: snippet_published_at
      snippet.updatedAt: snippet_updated_at
    hint_columns: [snippet_published_at, snippet_updated_at]

  - name: caption
    # Fivetran's caption table is one row per caption CUE, not per track:
    # keyed on (languages, start, video_id), with duration and text. `languages`
    # is plural and is part of the key. Reproduced exactly.
    #
    # `start` is a float in a merge key, which is normally a bad idea. It is safe
    # here because the value is derived arithmetically from the integer
    # milliseconds in the WebVTT cue timing, so the same track always produces
    # bit-identical keys — nothing rounds a measurement. Worth knowing that
    # Fivetran hit the neighbouring version of this and gave up: it changed
    # audience retention's `elapsedVideoTimeRatio` "as STRING instead of FLOAT"
    # for destination compatibility. If a destination ever objects to a float
    # key, that is the precedent for what to do about it.
    primary_key: [video_id, languages, start]
    write_disposition: merge
    # NO soft_delete, same reason as comment: this is a budget-bounded crawl.
    incremental:
      strategy: parent_fanout
      parent: video
      endpoint:
        path: /youtube/v3/captions
        base_url: https://www.googleapis.com
        family: data_api
        params:
          part: snippet
      # THE EXPENSIVE ONE, by two orders of magnitude. captions.list costs 50
      # units per video and captions.download costs 200 per track, against a
      # 10,000/day pool — so one video's captions is ~250 units and a full
      # catalogue is unreachable in a single run at any catalogue size.
      #
      # 250 units/run is deliberately exactly one video per run: ~24 videos a
      # day, so a 500-video channel completes its first pass in about three
      # weeks and afterwards only re-reads a track whose snippet.lastUpdated
      # moved. Which videos are already covered is persisted, so progress is
      # never lost. Raise this only after raising the project's Data API quota
      # in the Cloud console — the daily pool is the real ceiling, and the
      # cheap resources above are sized to leave exactly this much room.
      unit_budget: 250
    timestamp_columns: []

quality:
  # `channel` is the only table whose absence means the connector is broken.
  # Everything else is legitimately empty at some point: a report table does
  # not exist until ~48 hours after its job was created ("you can start
  # retrieving the report within 48 hours of the time that the job is
  # created"), `caption` is still crawling for weeks, and a channel with no
  # playlists or no comments has neither. dlt only creates a table once a
  # resource yields a row, so absence is silence rather than failure.
  #
  # channel_basic_a3 is deliberately NOT required, even though it is the
  # headline table: making it required turns the entire first two days of a new
  # connector red for a documented latency.
  required: [channel]
  freshness:
    # Measured on report CREATION time, not on `date`. `date` is a Pacific
    # calendar day held as text, so `max(date)` is a string comparison and
    # `now() - INTERVAL` cannot be applied to it — and creation time is the
    # better signal anyway: it answers "are new reports still arriving", which
    # is the thing that actually breaks.
    table: channel_basic_a3
    column: _report_create_time
    # 48h documented lag plus a day of margin. Below ~72 this fails routinely
    # on healthy runs.
    hours: 72
    # Advisory. A quiet channel still gets a report every day (YouTube "does
    # generate downloadable reports for days on which no data was available" —
    # a header-only CSV), so this is closer to gating than most freshness
    # checks here. It stays advisory because the failure it would catch —
    # reports stopping — is more reliably caught by a job's `expireTime`, which
    # the extension logs, and because a red DAG for a Google-side delay teaches
    # people to stop reading red DAGs.
    severity: warn
  max_deleted_fraction: 0.5
  references:
    # Deliberately NOT one edge per report table. Every report carries
    # channel_id and video_id, so 20 tables would mean 40 LEFT ANTI JOINs
    # against the full report tables on every `dq run` — real cost for a
    # failure mode that is identical in shape across all of them. One report
    # gates as the canary; the rest are covered by it in practice. Stated
    # rather than silently trimmed, so the gap is a decision and not an
    # oversight.
    - {child: channel_basic_a3.channel_id, parent: channel.id}
    # Entity edges, where the join is cheap and the meaning is specific.
    - {child: video.snippet_channel_id, parent: channel.id}
    - {child: playlist.snippet_channel_id, parent: channel.id}
    # Advisory, both for the same reason: a comment or caption can outlive the
    # video row. `comment.video_id` is EMPTY for comments about the channel
    # itself rather than a video (and the orphan check excludes nulls, not
    # empty strings), and `caption` is a budget-bounded crawl whose watermark
    # can legitimately run ahead of a video that has since been deleted.
    - {child: comment.video_id, parent: video.id, severity: warn}
    - {child: caption.video_id, parent: video.id, severity: warn}
  not_null:
    # The identity checks already assert not-null on every primary-key column,
    # so nothing here restates one. In particular there is deliberately no
    # not-null on any report dimension: `video_id`, `traffic_source_detail` and
    # `playback_location_detail` are legitimately EMPTY STRINGS, which the
    # generated key check passes and a hand-written "not blank" check would
    # not.
    channel: [snippet_title, snippet_published_at]
    video: [snippet_channel_id, snippet_title, snippet_published_at]
    playlist: [snippet_channel_id, snippet_title]
    comment: [snippet_published_at]
    caption: [text]

# A note on `endpoint.path: /v1` on every report resource above: no report
# resource fetches that URL. The path exists only so `runtime._routes` can
# attribute requests to a rate-limit family, and `_family_for` matches by
# substring — a report touches /v1/jobs, /v1/jobs/{id}/reports AND
# /v1/media/..., so /v1 is the prefix covering all three, which keeps CSV
# downloads counted under `reporting` rather than `unmatched` in the run
# summary. The Data API paths (/youtube/v3/...) do not contain it.
#
# Why this connector has Python at all — three things the declarative contract
# genuinely cannot say, none of them about a quirk of one endpoint:
#
#   the credential      an OAuth2 refresh-token grant: three secrets, a token
#                       minted per run at Google's token endpoint and refreshed
#                       on `expires_in` rather than a fixed hour. `api.auth`
#                       carries one env var and `_auth()` builds four static
#                       kinds, none of which is this.
#   reports are a queue  a report is not an endpoint. You create a job, then
#                       poll a list of generated CSVs by creation time,
#                       dedupe restatements by (startTime, endTime, createTime),
#                       download each one, and parse it by header. No paginator
#                       describes that.
#   quota is the bound   comment and caption are bounded by Data API UNITS
#                       rather than by a cursor, and have to persist where they
#                       stopped so the next run resumes instead of restarting.
extensions: youtube
